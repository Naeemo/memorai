<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memorai ChatGPT Importer</title>
  <link rel="stylesheet" href="./popup/style.css">
</head>
<body>
  <div class="popup">
    <header>
      <h1>Memorai</h1>
      <p class="subtitle">ChatGPT History Importer</p>
    </header>

    <!-- Import Section -->
    <section class="import-section">
      <button id="import-btn" class="btn-primary">Import ChatGPT History</button>
      <div id="import-progress" class="progress hidden">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-text" class="progress-text">0 / 0 conversations</p>
      </div>
      <p id="import-status" class="status"></p>
    </section>

    <!-- Stats -->
    <section class="stats hidden" id="stats-section">
      <div class="stat-card">
        <span class="stat-value" id="stat-conversations">0</span>
        <span class="stat-label">Conversations</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-messages">0</span>
        <span class="stat-label">Messages</span>
      </div>
    </section>

    <!-- Quick Search -->
    <section class="search-section">
      <input type="text" id="quick-search" placeholder="Search history..." class="search-input">
      <div id="quick-results" class="quick-results"></div>
    </section>

    <!-- Actions -->
    <section class="actions">
      <a href="./search.html" target="_blank" class="btn-secondary">Open Search Page</a>
      <button id="settings-btn" class="btn-ghost">Settings</button>
    </section>

    <!-- Settings Panel -->
    <section id="settings-panel" class="settings hidden">
      <div class="setting-row">
        <label for="ollama-url">Ollama URL</label>
        <input type="text" id="ollama-url" placeholder="http://localhost:11434">
      </div>
      <div class="setting-row">
        <label for="ollama-model">Embedding Model</label>
        <input type="text" id="ollama-model" placeholder="nomic-embed-text">
      </div>
      <div class="setting-row">
        <button id="save-settings-btn" class="btn-primary">Save</button>
        <button id="clear-data-btn" class="btn-danger">Clear All Data</button>
      </div>
    </section>
  </div>

  <script type="module" src="./popup/index.ts"></script>
</body>
</html>
