<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memorai Search — ChatGPT History</title>
  <link rel="stylesheet" href="./search/style.css">
</head>
<body>
  <div class="search-page">
    <header class="search-header">
      <div class="logo">
        <h1>Memorai</h1>
        <span>ChatGPT History Search</span>
      </div>
      <div class="header-stats">
        <span id="total-conversations">0 conversations</span>
        <span id="total-messages">0 messages</span>
        <button id="export-all-btn" class="btn-ghost">Export All</button>
      </div>
    </header>

    <div class="search-layout">
      <!-- Sidebar: Filters -->
      <aside class="filters">
        <h3>Filters</h3>
        <div class="filter-group">
          <label>Time Range</label>
          <select id="filter-time">
            <option value="all">All time</option>
            <option value="7d">Last 7 days</option>
            <option value="30d">Last 30 days</option>
            <option value="90d">Last 90 days</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Actor</label>
          <select id="filter-actor">
            <option value="all">All</option>
            <option value="user">You</option>
            <option value="assistant">ChatGPT</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Tags</label>
          <input type="text" id="filter-tags" placeholder="e.g. chatgpt, coding">
        </div>
      </aside>

      <!-- Main: Search + Results -->
      <main class="results-area">
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="Search your ChatGPT history..." class="search-input-lg">
          <button id="search-btn" class="btn-primary">Search</button>
        </div>

        <div id="search-results" class="results-list">
          <div class="empty-state">
            <p>Type a query to search your imported ChatGPT history.</p>
          </div>
        </div>
      </main>

      <!-- Detail Panel -->
      <aside class="detail-panel" id="detail-panel">
        <div class="empty-state">
          <p>Select a result to view the full conversation.</p>
        </div>
      </aside>
    </div>
  </div>

  <script type="module" src="./search/index.ts"></script>
</body>
</html>
