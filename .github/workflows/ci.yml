name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck memorai
        run: pnpm --filter memorai typecheck

      - name: Lint memorai
        run: pnpm --filter memorai lint

      - name: Test memorai
        run: pnpm --filter memorai test

      - name: Build memorai
        run: pnpm --filter memorai build

      - name: Typecheck browser-extension
        run: pnpm --filter @memorai/browser-extension check

      - name: Test browser-extension
        run: pnpm --filter @memorai/browser-extension test

      - name: Build browser-extension
        run: pnpm --filter @memorai/browser-extension build

  benchmark-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull nomic-embed-text
          ollama pull gemma4:e2b

      - name: Run custom synthetic benchmark
        run: pnpm --filter @memorai/benchmarks bench:custom
        env:
          OLLAMA_BASE_URL: http://localhost:11434
